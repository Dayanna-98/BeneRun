name: Code Quality

on:
  push:
    branches: [ main, front-end ]
  pull_request:
    branches: [ main, front-end ]

jobs:
  phpstan:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv
      
      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader
      
      - name: Run PHPStan analysis
        run: ./vendor/bin/phpstan analyse --memory-limit=512M --error-format=github
        continue-on-error: true

  security-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Composer security audit
        run: |
          composer audit --locked || {
            echo "::warning::Composer audit found vulnerabilities. This step is non-blocking in quality workflow."
          }

  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Front-end/maquette

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Front-end/maquette/package-lock.json

      - name: Install NPM dependencies
        run: npm ci

      - name: Run oxlint
        run: npx oxlint .
        continue-on-error: true

      - name: Run ESLint (no fix, report only)
        run: npx eslint . --cache false
        continue-on-error: true
