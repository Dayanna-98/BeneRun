[program:reverb-worker]
; Supervisor config pour Laravel Reverb WebSocket server
; À copier dans /etc/supervisor/conf.d/ sur le serveur de production
; puis : supervisorctl reread && supervisorctl update && supervisorctl start reverb-worker

command=php /var/www/benerun/artisan reverb:start --host=0.0.0.0 --port=8081 --no-interaction
directory=/var/www/benerun
user=www-data
autostart=true
autorestart=true
startsecs=3
redirect_stderr=true
stdout_logfile=/var/www/benerun/storage/logs/reverb.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stopwaitsecs=10
